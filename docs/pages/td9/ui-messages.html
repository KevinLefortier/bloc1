<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/ui-messages.css">
    <title>UI Messages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
</head>
<body>
    <div class="ui container" style="margin-top: 20px;">
        <h1 class="ui header">Exemples de Messages (UI Messages)</h1>

        <!-- Zone de message par défaut -->
        <div id="defaultMessage" class="ui message">
            <div class="header">Message par défaut</div>
            <p>La zone de messages est actuellement vide.</p>
        </div>

        <!-- Zone pour les messages dynamiques -->
        <div id="dynamicMessageArea" style="margin-top: 20px;"></div>

        <!-- Bouton pour ouvrir le formulaire -->
        <button class="ui button primary" id="openModalButton" style="margin-top: 20px;">
            Ajouter un message
        </button>
    </div>

    <!-- Modal avec le formulaire -->
    <div class="ui modal" id="messageModal">
        <div class="header">Créer un nouveau message</div>
        <div class="content">
            <form class="ui form">
                <!-- Type de message -->
                <div class="field">
                    <label>Type de message</label>
                    <select id="modalMessageType" class="ui dropdown">
                        <option value="default">Default</option>
                        <option value="positive">Success</option>
                        <option value="negative">Error</option>
                        <option value="warning">Warning</option>
                        <option value="info">Info</option>
                    </select>
                </div>

                <!-- Icône -->
                <div class="field">
                    <label>Icône</label>
                    <input type="text" id="modalMessageIcon" placeholder="Icône du message (ex. info circle)">
                </div>

                <!-- Titre -->
                <div class="field">
                    <label>Titre</label>
                    <input type="text" id="modalMessageTitle" placeholder="Titre du message">
                </div>

                <!-- Contenu -->
                <div class="field">
                    <label>Contenu</label>
                    <textarea id="modalMessageContent" placeholder="Contenu du message"></textarea>
                </div>

                <!-- Option closeable -->
                <div class="field">
                    <div class="ui toggle checkbox">
                        <input type="checkbox" id="modalMessageCloseable">
                        <label>Rendre le message refermable</label>
                    </div>
                </div>
            </form>
        </div>

        <!-- Boutons d'action -->
        <div class="actions">
            <button class="ui button cancel">Annuler</button>
            <button class="ui button primary" id="addMessageButton">Ajouter le message</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
    <script src="scripts/ui-messages.js"></script>
</body>
</html>
